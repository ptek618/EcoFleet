name: ecofleet-apu-dockerfile
services:
- name: backend
  git:
    repo_clone_url: https://github.com/ptek618/EcoFleet.git
    branch: devin/1754147792-ecofleet-mobile-app
  dockerfile_path: Dockerfile.backend
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /api
  envs:
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: CORS_ORIGINS
    value: "*"
    scope: RUN_TIME
  - key: DATABASE_URL
    value: ${ecofleet-db.DATABASE_URL}
    scope: RUN_TIME
- name: frontend
  git:
    repo_clone_url: https://github.com/ptek618/EcoFleet.git
    branch: devin/1754147792-ecofleet-mobile-app
  dockerfile_path: Dockerfile.frontend
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: VITE_API_URL
    value: ${backend.PUBLIC_URL}
    scope: BUILD_TIME

databases:
- name: ecofleet-db
  engine: PG
  version: "15"
  size: basic
  num_nodes: 1
